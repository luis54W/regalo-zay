<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestro Aniversario</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="stars"></div>

  <main class="collage-container">
    <header class="title-card">
      <h1 class="animated-title">Feliz Aniversario</h1>
      <p>Haz clic en cada fotografía para descubrir un mensaje especial ✨</p>
    </header>

    <!-- Galería Collage (19 fotos interactivas) -->
    <div class="collage-grid">
      
      <!-- Bloque 1 (1 a 5): Corazones -->
      <div class="photo-card anim-heart card-1">
        <input type="checkbox" id="flip-1" class="flip-toggle" hidden>
        <label for="flip-1" class="flip-card-inner">
          <div class="flip-card-front">
            <img src="colombia.jpeg" alt="Foto 1">
            <span>Nuestros momentos ❤️</span>
          </div>
          <div class="flip-card-back">
            <p class="love-text">"Recuerdos de nuestro viaje a colombia"</p>
          </div>
        </label>
      </div>

      <div class="photo-card anim-heart card-2">
        <input type="checkbox" id="flip-2" class="flip-toggle" hidden>
        <label for="flip-2" class="flip-card-inner">
          <div class="flip-card-front">
            <img src="cuerna_2.jpeg" alt="Foto 2">
            <span> Tiempo juntos ✨</span>
          </div>
          <div class="flip-card-back">
            <p class="love-text">"Tu sonrisa es lo que más me gusta de ti; siempre añoro eso constantemente."</p>
          </div>
        </label>
      </div>

      <div class="photo-card anim-heart card-3">
        <input type="checkbox" id="flip-3" class="flip-toggle" hidden>
        <label for="flip-3" class="flip-card-inner">
          <div class="flip-card-front">
            <img src="dinamos_3.jpeg" alt="Foto 3">
            <span>Días de aventura ☀️</span>
          </div>
          <div class="flip-card-back">
            <p class="love-text">"Explorar los dinamos contigo fue una experiencia inolvidable."</p>
          </div>
        </label>
      </div>

      <div class="photo-card anim-heart card-4">
        <input type="checkbox" id="flip-4" class="flip-toggle" hidden>
        <label for="flip-4" class="flip-card-inner">
          <div class="flip-card-front">
            <img src="dinamos_5.jpeg" alt="Foto 4">
            <span>Disfrutando la vida 🌊</span>
          </div>
          <div class="flip-card-back">
            <p class="love-text">"Incluso contigo aprendí que la felicidad está en los detalles más sencillos."</p>
          </div>
        </label>
      </div>

      <div class="photo-card anim-heart card-5">
        <input type="checkbox" id="flip-5" class="flip-toggle" hidden>
        <label for="flip-5" class="flip-card-inner">
          <div class="flip-card-front">
            <img src="graduacion.jpeg" alt="Foto 5">
            <span>Momentos especiales 🎓</span>
          </div>
          <div class="flip-card-back">
            <p class="love-text">"Celebrar los logros y ver que cumplimos nuestras metas y sueños juntos es lo que más me llena de orgullo."</p>
          </div>
        </label>
      </div>

      <!-- Bloque 2 (6 a 10): Gatitos -->
      <div class="photo-card anim-cat card-6 fit-contain">
        <input type="checkbox" id="flip-6" class="flip-toggle" hidden>
        <label for="flip-6" class="flip-card-inner">
          <div class="flip-card-front">
            <img src="halloween2025.jpeg" alt="Foto 6">
            <span>Halloween 🎃</span>
          </div>
          <div class="flip-card-back">
            <p class="love-text">"El 1er jawolin que tuvimos, me sentí feliz de compartir lo mucho que te amo :)))"</p>
          </div>
        </label>
      </div>

      <div class="photo-card anim-cat card-7">
        <input type="checkbox" id="flip-7" class="flip-toggle" hidden>
        <label for="flip-7" class="flip-card-inner">
          <div class="flip-card-front">
            <img src="1ra-foto.jpeg" alt="Foto 7">
            <span>Donde todo empezó 💫</span>
          </div>
          <div class="flip-card-back">
            <p class="love-text">"Aquí comenzó la mejor historia de mi vida, nuestra historia juntos."</p>
          </div>
        </label>
      </div>

      <div class="photo-card anim-cat card-8 fit-contain">
        <input type="checkbox" id="flip-8" class="flip-toggle" hidden>
        <label for="flip-8" class="flip-card-inner">
          <div class="flip-card-front">
            <img src="acdc_2.jpeg" alt="Foto 8">
            <span>Inolvidable 🔥</span>
          </div>
          <div class="flip-card-back">
            <p class="love-text">"Me encanta que fueras conmigo a ese concierto, no imaginas lo mucho que me divertí contigo ese dia"</p>
          </div>
        </label>
      </div>

      <div class="photo-card anim-cat card-9">
        <input type="checkbox" id="flip-9" class="flip-toggle" hidden>
        <label for="flip-9" class="flip-card-inner">
          <div class="flip-card-front">
            <img src="acuario_2.jpeg" alt="Foto 9">
            <span>Bajo el mar 🐠</span>
          </div>
          <div class="flip-card-back">
            <p class="love-text">"Adoro que esa vez hicimos de todo y nos divertimos como nunca"</p>
          </div>
        </label>
      </div>

      <div class="photo-card anim-cat card-10">
        <input type="checkbox" id="flip-10" class="flip-toggle" hidden>
        <label for="flip-10" class="flip-card-inner">
          <div class="flip-card-front">
            <img src="acuario.jpeg" alt="Foto 10">
            <span>Juntos siempre 💙</span>
          </div>
          <div class="flip-card-back">
            <p class="love-text">"Sostener tu mano sin importar el lugar ni el tiempo es lo que me hace muy feliz"</p>
          </div>
        </label>
      </div>

      <!-- Bloque 3 (11 a 15): Frappés -->
      <div class="photo-card anim-frappe card-11">
        <input type="checkbox" id="flip-11" class="flip-toggle" hidden>
        <label for="flip-11" class="flip-card-inner">
          <div class="flip-card-front">
            <img src="toluca.jpeg" alt="Foto 11">
            <span>Paseos especiales 🌿</span>
          </div>
          <div class="flip-card-back">
            <p class="love-text">"Contigo viajaria a cualquier lugar, tu compañía es muy especial"</p>
          </div>
        </label>
      </div>

      <div class="photo-card anim-frappe card-12">
        <input type="checkbox" id="flip-12" class="flip-toggle" hidden>
        <label for="flip-12" class="flip-card-inner">
          <div class="flip-card-front">
            <img src="toluca_2.jpeg" alt="Foto 12">
            <span>Vitrales asombrosos 🌸</span>
          </div>
          <div class="flip-card-back">
            <p class="love-text">"Cada abrazo que me das es un regalo que atesoro mucho bb."</p>
          </div>
        </label>
      </div>

      <div class="photo-card anim-frappe card-14 fit-contain">
        <input type="checkbox" id="flip-14" class="flip-toggle" hidden>
        <label for="flip-14" class="flip-card-inner">
          <div class="flip-card-front">
            <img src="halloween2026.jpeg" alt="Foto 14">
            <span>Disfraces y desmadre👑</span>
          </div>
          <div class="flip-card-back">
            <p class="love-text">"Me encanto compartir tiempo y anecdotas con tus amig@s más cercanos "</p>
          </div>
        </label>
      </div>

      <div class="photo-card anim-frappe card-15">
        <input type="checkbox" id="flip-15" class="flip-toggle" hidden>
        <label for="flip-15" class="flip-card-inner">
          <div class="flip-card-front">
            <img src="halloween2026_2.jpeg" alt="Foto 15">
            <span>Amor de jalowin 💖</span>
          </div>
          <div class="flip-card-back">
            <p class="love-text">"No hay palabra que intente explicar lo mucho que te amo."</p>
          </div>
        </label>
      </div>

      <!-- Bloque 4 (16 a 19): Corazones -->
      <div class="photo-card anim-heart card-16">
        <input type="checkbox" id="flip-16" class="flip-toggle" hidden>
        <label for="flip-16" class="flip-card-inner">
          <div class="flip-card-front">
            <img src="kanoa.jpeg" alt="Foto 16">
            <span>Remando juntos 🚣‍♂️</span>
          </div>
          <div class="flip-card-back">
            <p class="love-text">"Me encanto ver el atardecer contigo, lastima que nos picaron los mosquitos :((("</p>
          </div>
        </label>
      </div>

      <div class="photo-card anim-heart card-17">
        <input type="checkbox" id="flip-17" class="flip-toggle" hidden>
        <label for="flip-17" class="flip-card-inner">
          <div class="flip-card-front">
            <img src="six-flags.jpeg" alt="Foto 17">
            <span>Día de six flags 🎢</span>
          </div>
          <div class="flip-card-back">
            <p class="love-text">"Eres mi minion favorito <3"</p>
          </div>
        </label>
      </div>

      <div class="photo-card anim-heart card-18 fit-contain">
        <input type="checkbox" id="flip-18" class="flip-toggle" hidden>
        <label for="flip-18" class="flip-card-inner">
          <div class="flip-card-front">
            <img src="tepoz.jpeg" alt="Foto 18">
            <span>Vistas hermosas ⛰️</span>
          </div>
          <div class="flip-card-back">
            <p class="love-text">"Aunque no confiaste en mi pa manejar la moto, hice que te divirtieras mucho, como te amo jaja"</p>
          </div>
        </label>
      </div>

      <div class="photo-card anim-heart card-19">
        <input type="checkbox" id="flip-19" class="flip-toggle" hidden>
        <label for="flip-19" class="flip-card-inner">
          <div class="flip-card-front">
            <img src="zay.jpeg" alt="Foto 19">
            <span>La más hermosa ✨</span>
          </div>
          <div class="flip-card-back">
            <p class="love-text">"Eres la única persona que me hace sentir cosas que nunca pensé, eres donde siempre quiero quedarme."</p>
          </div>
        </label>
      </div>

    </div>

    <!-- Corazón Central -->
    <div class="heart-container">
      <div class="heart"></div>
    </div>

    <!-- Botón Sorpresa con CSS Puro -->
    <div class="surprise-wrapper">
      <input type="checkbox" id="surprise-toggle" hidden>
      <label for="surprise-toggle" class="surprise-btn">
        <span class="btn-text-show">¡Haz clic aquí! 🎁</span>
        <span class="btn-text-hide">Ocultar mensaje ✉️</span>
      </label>
      
      <div class="message-card">
        <div class="celebration-effects top-effects">
          <span>🎆</span><span>🎈</span><span>💖</span><span>🎆</span><span>🎈</span>
        </div>
        <p class="animated-text">
          Mi vida hermosa, mi niña, mi mundo, eres todo lo que soñe toda mi vida, estoy muy agradecido con la vida por haberme permitido compartir mis metas, mis miedos, mis logros, todo mi ser contigo, te amo
        </p>
        <div class="celebration-effects bottom-effects">
          <span>🥳</span><span>💕</span><span>✨</span><span>🎈</span><span>💖</span>
        </div>
      </div>
    </div>
  </main>

</body>
</html>
